<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- White marble: soft grey clouding plus fine veins, drawn from noise (no photograph). -->
  <defs>
    <filter id="clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0014 0.003" numOctaves="4" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.57  0 0 0 0 0.61  0.8 0 0 0 -0.3"/>
    </filter>
    <filter id="veins" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.0015 0.0042" numOctaves="5" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.38  0 0 0 0 0.43  -3.2 0 0 0 0.56"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f4f3f0"/>
  <rect width="1600" height="1000" filter="url(#clouds)"/>
  <rect width="1600" height="1000" filter="url(#veins)" opacity="0.5"/>
</svg>
